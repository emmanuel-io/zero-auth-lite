[project]
site_name = "Zero Auth Lite"
site_description = "Readable authentication, authorization, OAuth2, and OpenID Connect for FastAPI."
site_url = "https://emmanuel-io.github.io/zero-auth-lite/"
repo_url = "https://github.com/emmanuel-io/zero-auth-lite"
repo_name = "emmanuel-io/zero-auth-lite"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8008"
nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        { "Installation" = "getting-started/installation.md" },
        { "Initial configuration" = "getting-started/configuration.md" },
        { "First OAuth2 client" = "getting-started/first-client.md" },
    ] },
    { "Guides" = [
        { "Authentication and authorization" = "guides/authentication-and-authorization.md" },
        { "Browser sessions and CSRF" = "guides/sessions-and-csrf.md" },
        { "Built-in authentication UI" = "guides/builtin-authentication-ui.md" },
        { "External authentication UI" = "guides/external-authentication-ui.md" },
        { "Users and organizations" = "guides/users-and-organizations.md" },
        { "OAuth2 flows" = "guides/oauth2-flows.md" },
        { "OAuth2 client authentication" = "guides/oauth2-client-authentication.md" },
        { "OAuth2 device flow" = "guides/oauth2-device-flow.md" },
        { "OAuth2 discovery" = "guides/oauth2-discovery.md" },
        { "OpenID Connect" = "guides/openid-connect.md" },
    ] },
    { "Operations" = [
        { "Deployment" = "operations/deployment.md" },
        { "Database" = "operations/database.md" },
        { "Migrations" = "operations/migrations.md" },
        { "Backups and recovery" = "operations/backups.md" },
        { "Logging and monitoring" = "operations/logging.md" },
        { "Machine client provisioning" = "operations/oauth2-client-provisioning.md" },
        { "Outbox worker" = "operations/outbox-worker.md" },
        { "OAuth2 cleanup" = "operations/oauth2-cleanup.md" },
        { "Signing keys" = "operations/signing-keys.md" },
        { "Trust boundaries" = "operations/trust-boundaries.md" },
        { "Security" = "operations/security.md" },
    ] },
    { "Reference" = [
        { "Settings" = "reference/settings.md" },
        { "Routes" = "reference/routes.md" },
        { "Errors" = "reference/errors.md" },
        { "OAuth2 errors" = "reference/oauth2-errors.md" },
    ] },
    { "Development" = [
        { "Development setup" = "development/setup.md" },
        { "Repository structure" = "development/repository-structure.md" },
        { "Server composition" = "development/composition.md" },
        { "Persistence contracts" = "development/persistence-contracts.md" },
        { "Identity boundary" = "development/identity-repository.md" },
        { "Router composition" = "development/router-mounting.md" },
        { "Database migrations" = "development/database-migrations.md" },
        { "OAuth2 routing contract" = "development/oauth2-routing.md" },
        { "Documentation and contribution" = "development/documentation.md" },
        { "Architecture decisions" = [
            { "Immutable startup settings" = "development/architecture/adr-startup-settings.md" },
            { "API identifiers" = "development/architecture/adr-api-identifiers.md" },
            { "Transactions and notification outbox" = "development/architecture/adr-transaction-boundaries-and-outbox.md" },
            { "OAuth2 typed FastAPI parameters" = "development/architecture/adr-oauth2-typed-fastapi-parameters.md" },
            { "Service DTOs and HTTP schemas" = "development/architecture/adr-service-dtos-and-http-schemas.md" },
        ] },
    ] },
]

[project.theme]
variant = "modern"
features = [
    "content.code.annotate",
    "content.code.copy",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "search.highlight",
    "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true
invalid_links = true
invalid_link_anchors = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_source = false
members_order = "source"
separate_signature = true
show_signature_annotations = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
