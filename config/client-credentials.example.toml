# After migrations, provision a confidential client locally:
# uv run python -m app.oauth2.clients.provision --name "Example worker"
# See docs/operations/oauth2-client-provisioning.md for scopes and organization access.

db_path = "./data/zero-auth-lite.db"

[api]
interactive_auth_routes_enabled = false

[mail]
enabled = false

[browser_session]
enabled = false

[oauth2]
authorization_code_enabled = false
refresh_token_enabled = false
device_code_enabled = false
oidc_enabled = false

[ui]
identity_workflow_mode = "disabled"
oauth2_interaction = "disabled"
organization_admin_enabled = false
operator_enabled = false

[identity_workflow]
registration_enabled = false
