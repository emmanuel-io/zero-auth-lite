# Full-server Docker Compose HTTPS profile.
# Copy to zero-auth-lite.toml. Commented values show supported defaults or optional
# settings. Uncomment only explicit overrides and replace every placeholder
# secret before selecting deployment mode.

# Root storage, process identity, and navigation settings
# runtime_dir = "/tmp/zero-auth-lite"
# db_path = "./data/zero-auth-lite.db"
# db_echo = false
# default_redirect_url = "https://application.example"

[app]
# environment = "development"
# log_level = "INFO"
trusted_hosts = ["auth.zero-auth-lite.localhost", "api.zero-auth-lite.localhost", "localhost", "127.0.0.1"]
# Compose supplies its trusted Caddy address as a ZA_* override.
# trusted_proxy_ips = []

[api]
# interactive_auth_routes_enabled = true

[ui]
# identity_workflow_mode = "builtin"
# management_authentication = "builtin"
# oauth2_interaction = "builtin"
# organization_admin_enabled = true
# operator_enabled = true

[ui.urls]
# login = "/login"
# logout = "/logout"
# verification = "https://auth.zero-auth-lite.localhost:8443/verify-email"
# password_reset = "https://auth.zero-auth-lite.localhost:8443/reset-password"
# invitation = "https://auth.zero-auth-lite.localhost:8443/accept-invite"
# authorization_interaction = "/login"
# authorization_consent = "/consent"
# device_interaction = "https://auth.zero-auth-lite.localhost:8443/oauth2/device/verify"

[bootstrap]
# operator_email = "operator@example.com"
# operator_password = "Change-me-1!"
# organization_name = "Zero Auth Lite"
# first_name = "Bootstrap"
# last_name = "Operator"

[cors]
# Use [] for a same-origin server that does not need CORS.
allowed_origins = ["https://auth.zero-auth-lite.localhost:8443", "https://api.zero-auth-lite.localhost:8443", "http://localhost:8000"]
# allow_credentials = true
# allow_methods = ["*"]
# allow_headers = ["*"]
# expose_headers = ["X-CSRF-Token", "X-Request-Id"]

[browser_session]
# enabled = true
# cookie_domain = "zero-auth-lite.localhost"
# cookie_name = "sessionid"
# cookie_same_site = "lax"
# cookie_secure = true
hash_secret = "replace-with-at-least-32-random-characters"
# absolute_ttl_seconds = 604800
# cleanup_batch_size = 100
# cleanup_interval_seconds = 3600
# max_sessions_per_user = 10
# slide_seconds = 1800
# ttl_seconds = 28800

[browser_session.csrf]
# cookie_domain = "zero-auth-lite.localhost"
# cookie_name = "csrftoken"
# cookie_same_site = "lax"
# cookie_secure = true
# expose_token = "header"
# header_name = "X-CSRF-Token"
# origin_check_enabled = true
# pattern = "synchronizer_token"
# public_origin = "https://auth.zero-auth-lite.localhost:8443"
# trusted_origins = ["https://auth.zero-auth-lite.localhost:8443", "https://api.zero-auth-lite.localhost:8443", "http://localhost:8000"]
# ttl_seconds = 28800

[oauth2]
# authorization_code_enabled = true
# refresh_token_enabled = true
# client_credentials_enabled = true
# device_code_enabled = true
# allow_client_secret_post = true
# jwks_enabled = true
# oidc_enabled = true
# issuer = "https://auth.zero-auth-lite.localhost:8443"
# access_token_audience = "zero-auth-lite-example-api"
# signing_key_id = "local-dev-key"
# authorization_code_ttl_seconds = 300
# access_token_lifetime_seconds = 900
# id_token_lifetime_seconds = 900
# refresh_token_lifetime_seconds = 2592000
# device_code_lifetime_seconds = 1800
# device_code_interval_seconds = 5
# device_code_create_attempts = 5
# cleanup_interval_seconds = 3600
# cleanup_batch_size = 100
authorization_code_hash_secret = "replace-with-at-least-32-random-characters"
token_hash_secret = "replace-with-at-least-32-random-characters"
# Built-in keys are local-only. Configure a new raw Ed25519 pair in deployment.
# signing_private_key_b64 = "base64-encoded-raw-private-key"
# signing_public_key_b64 = "base64-encoded-raw-public-key"
# previous_public_keys = []

[identity_workflow]
# registration_enabled = true

[identity_workflow.workflow_tokens]
# derivation_key_id = "default"
derivation_secret = "replace-with-at-least-32-random-characters"
# previous_derivation_secrets = [{ key_id = "previous", secret = "replace-with-a-previous-secret-value" }]
# verify_token_ttl_seconds = 86400
# invite_token_ttl_seconds = 604800
# reset_token_ttl_seconds = 3600

[mail]
# enabled = true
# default_from_email = "zero-auth-lite@example.com"
# default_from_name = "Zero Auth Lite"
# reply_to_email = "reply@example.com"
# template_dir = "/absolute/path/to/templates"
smtp_host = "mailpit"
