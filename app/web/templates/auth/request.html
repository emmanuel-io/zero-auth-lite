{% extends "base.html" %}
{% block title %}{{ title }} · Zero Auth Lite{% endblock %}
{% block content %}
  <header class="auth-header">
    <p class="eyebrow">Account security</p>
    <h1 id="page-title">{{ title }}</h1>
    <p class="muted">{{ description }}</p>
  </header>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form class="form-stack" method="post" action="{{ action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" maxlength="{{ form_constraints.email_max }}" required autofocus>
    </div>
    <button class="button--primary" type="submit">{{ submit_label }}</button>
  </form>
{% endblock %}
