{% extends "base.html" %}
{% block title %}Device verification · Zero Auth Lite{% endblock %}
{% block content %}
  <header class="auth-header">
    <p class="eyebrow">Device authorization</p>
    <h1 id="page-title">Verify a device</h1>
    <p class="muted">Enter the code shown on your device, then approve or deny access.</p>
  </header>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form class="form-stack" method="post" action="{{ url_for('device_verify_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="user-code">User code</label>
      <input id="user-code" name="user_code" value="{{ user_code }}" autocomplete="one-time-code" required autofocus>
    </div>
    <div class="actions">
      <button class="button--secondary" type="submit" name="decision" value="deny">Deny</button>
      <button class="button--primary" type="submit" name="decision" value="approve">Approve</button>
    </div>
  </form>
{% endblock %}
