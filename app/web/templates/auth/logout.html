{% extends "base.html" %}
{% block title %}Sign out · Zero Auth Lite{% endblock %}
{% block content %}
  <header class="auth-header">
    <p class="eyebrow">Session</p>
    <h1 id="page-title">Sign out</h1>
    <p class="muted">End this browser session.</p>
  </header>
  <form class="form-stack" method="post" action="{{ url_for('submit_logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="button--primary" type="submit">Sign out</button>
  </form>
{% endblock %}
