{% extends "base.html" %}
{% block title %}Register · Zero Auth Lite{% endblock %}
{% block content %}
  <header class="auth-header">
    <p class="eyebrow">Create an account</p>
    <h1 id="page-title">Register</h1>
    <p class="muted">Create an organization and its first identity.</p>
  </header>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form class="form-stack" method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="organization_name">Organization name</label>
      <input id="organization_name" name="organization_name" value="{{ organization_name }}" maxlength="{{ form_constraints.organization_name_max }}" required>
    </div>
    <div class="field">
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" value="{{ first_name }}" maxlength="{{ form_constraints.first_name_max }}">
    </div>
    <div class="field">
      <label for="last_name">Last name</label>
      <input id="last_name" name="last_name" value="{{ last_name }}" maxlength="{{ form_constraints.last_name_max }}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" maxlength="{{ form_constraints.email_max }}" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{ form_constraints.password_min }}" maxlength="{{ form_constraints.password_max }}" required>
    </div>
    <button class="button--primary" type="submit">Register</button>
  </form>
{% endblock %}
