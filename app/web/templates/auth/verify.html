{% extends "base.html" %}
{% block title %}Verify email · Zero Auth Lite{% endblock %}
{% block content %}
  <header class="auth-header">
    <p class="eyebrow">Account security</p>
    <h1 id="page-title">Verify your email</h1>
    <p class="muted">Confirm that this email address belongs to you.</p>
  </header>
  <form class="form-stack" method="post" action="{{ url_for('submit_verification') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button class="button--primary" type="submit">Verify email</button>
  </form>
{% endblock %}
