name: Quality

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen --all-groups --all-extras

      - run: ./scripts/check.sh ruff
      - run: uv run ruff format --check app tests docs/snippets scripts
      - run: ./scripts/check.sh mypy
      - run: ./scripts/check.sh test
